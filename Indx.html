<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نموذج التسجيل</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f2f2f2;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h4 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .radio-group {
      margin-bottom: 20px;
    }

    input[type="radio"] {
      margin-left: 5px;
    }

    input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    input[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <form method="post" action="https://script.google.com/macros/s/AKfycbyiDzj7zKrrJeg34aEj4gC9amR0BXsOjsZjLCnaFyBOa-p8TLzn3A6l_VK1Qi2FZ2oP5Q/exec" name="contact-form">
      <h4>نموذج التسجيل</h4>

      <!-- المقاس -->
      <label for="size">المقاس:</label>
      <select id="size" name="size" required>
        <option value="">اختر المقاس</option>
        <option value="S">صغير (S)</option>
        <option value="M">متوسط (M)</option>
        <option value="L">كبير (L)</option>
        <option value="XL">كبير جدًا (XL)</option>
      </select>

      <!-- نوع المنتج -->
      <label>نوع المنتج:</label>
      <div class="radio-group">
        <input type="radio" id="shirt" name="productType" value="قميص" required>
        <label for="shirt">قميص</label>
        <input type="radio" id="jacket" name="productType" value="سترة">
        <label for="jacket">سترة</label>
      </div>

      <!-- الحقول الأخرى في صفين -->
      <div class="grid-two">
        <div>
          <label for="your-name">الاسم الكامل:</label>
          <input type="text" name="your-name" placeholder="الاسم الكامل" required>
        </div>

        <div>
          <label for="your-number">رقم الهاتف:</label>
          <input type="text" name="your-number" placeholder="رقم الهاتف" required>
        </div>

        <div>
          <label for="your-email">البريد الإلكتروني:</label>
          <input type="email" name="your-email" placeholder="البريد الإلكتروني" required>
        </div>

        <!-- خانة إضافية فارغة للحفاظ على التناسق -->
        <div></div>
      </div>

      <input type="submit" value="إرسال">
    </form>
    <script>
        document.querySelector("form[name='contact-form']").addEventListener("submit", function(e) {
          e.preventDefault();
      
          const form = e.target;
          const data = new FormData(form);
      
          fetch(form.action, {
            method: "POST",
            body: data
          })
          .then(response => {
            if (response.ok) {
              window.location.href = "https://sites.google.com/view/good-product-dz/%D8%B5%D9%81%D8%AD%D8%A9-%D8%A7%D9%84%D8%B4%D9%83%D8%B1"; // ← 🔁 ضع هنا رابط صفحة الشكر
            } else {
              alert("حدث خطأ أثناء الإرسال. حاول مرة أخرى.");
            }
          })
          .catch(error => {
            console.error("خطأ:", error);
            alert("حدث خطأ أثناء الإرسال.");
          });
        });
      </script>
      
  </div>

</body>
</html>
